<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <h1>프런트엔드 개발자 지원서</h1>
    <form action="">
    <p>HTML, CSS, Javascript에 대한 기술적 이해와 경험이 있는 분을 찾습니다.</p>
    <hr>
    <p><b>개인정보</b></p>
    <UL>
        <!--
        ?name=염성원&tel
        -->
        <li>이름<input type="text" placeholder="공백없이 입력하세요" name="name"></li> 
        <li>연락처<input type="tel" name="tel"></li>

        <!-- name : 서버에 데이터를 넘길때-->
        
    <p><b>지원 분야</b></p>
    <ul>
        <li class="red"><input type="radio" name="field" id="" value="1">웹 퍼블리싱</li>
        <li class="red"><input type="radio" name="field" id="" value="2">웹 애플리케이션 개발</li>
        <li class="red"><input type="radio" name="field" id="" value="3">개발 환경 개선</li>
    </ul>
    
    <p><b>지원동기</p></b>
    <textarea cols="60" rows="5" name="motive" id="" placeholder="본사 지원 동기를 간략히 써 주세요. "></textarea>
    <br>
    <button type="submit">접수하기</button>
    <button type="reset">다시쓰기</button>
</form>
</body>
</html>
