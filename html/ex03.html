<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #number{
            width: 20px;
            height: 30px;
        }
        label{
            display: inline-block;
            width: 100px;
        }
    </style>
</head>
<body>
    <h1>레드향 주문하기</h1>
    <form action="loginAction.html"></form>
    <fieldset>
        <legend>상품 선택</legend><br>
        <h4>주문할 상품을 선택해 주세요</h4>
        <ul>
            <li>
                <input type="checkbox" name="" id="gift1">
                <label for="gigt1">선물용 3kg</label>
                <input type="number">개
                <small>(최대 5개)</small>
            </li>
            <li>
                <input type="checkbox" name="" id="gift1">
                <label for="gigt2">선물용 5kg</label>
                <input type="number">개
                <small>(최대 3개)</small>
            </li>
            <li>
                <input type="checkbox" name="" id="gift1">
                <label for="gigt1">가정용 3kg</label>
                <input type="number">개
                <small>(최대 5개)</small>
            </li>
            <li>
                <input type="checkbox" name="" id="gift1">
                <label for="gigt1">가정용 5kg</label>
                <input type="number">개
                <small>(최대 3개)</small>
            </li>
        </ul>
        <legend>포장 선택</legend>
        <ul>
            <li>
                <input type="radio" name="pack" id="pack1">
                <label for="pack1">선물 포장</label>
            </li>
            <li>
                <input type="radio" name="pack" id="pack2">
                <label for="pick2">선물 포장 안 함</label>
            </li>
        </ul>
    </fieldset>
    <fieldset>
    <legend>배송 정보</legend>
    <ul>
        <li>
            <label for="name">이름</label>
            <input type="text" name="" id="name">
        </li>
        <li>
            <label for="address">배송 주소</label>
            <input type="text" name="" id="addredd">
        </li>
        <li>
            <label for="email">이메일</label>
            <input type="text" name="" id="email">
        </li>
        <li>
            <label for="phonenumber">연락처</label>
            <input type="text" name="" id="phonenumber">
        </li>
        <li>
            <label for="date">배송 지정</label>
            <input type="date" name="" id="date"> 
            <small>(주문일로부터 최소 3일 이후)</small>
        </li>
        <li>
            <label for="memo">메모</label>
            <textarea name="memo" cols="40" rows="5"></textarea>
        </li>
    </ul>
    </fieldset>
    <button>주문하기</button>
    <button>취소하기</button>
</body>
</html>
